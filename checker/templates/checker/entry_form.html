{% extends "checker/base.html" %}

{% block content %}
<h2>{% if form.instance.pk %}Edit Entry{% else %}Add New Entry{% endif %}</h2>

<form method="post" enctype="multipart/form-data">
    {% csrf_token %}

    <div class="form-group">
        <label for="id_title">Title:</label>
        {{ form.title }}
    </div>

    <div class="form-group">
        <label for="id_uploaded_file">Upload File:</label>
        {{ form.uploaded_file }}
    </div>

    <div class="form-group">
        <label for="id_pasted_text">Paste Text:</label>
        {{ form.pasted_text }}
    </div>

    <button type="submit">{% if form.instance.pk %}Update Entry{% else %}Add Entry{% endif %}</button>
    <a href="{% url 'checker:entry_list' %}" style="margin-left: 10px;">Cancel</a>
</form>
{% endblock %}
